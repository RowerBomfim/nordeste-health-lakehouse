resources:
  jobs:
    nordeste_health_pipeline:
      name: nordeste-health-lakehouse
      description: Pipeline batch Bronze, Silver, Gold e validação analítica do recorte Nordeste.
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze_ingestion.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/02_silver_transformation.py

        - task_key: gold
          depends_on:
            - task_key: silver
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/03_gold_model.py

        - task_key: analytics_validation
          depends_on:
            - task_key: gold
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ../src/notebooks/04_analytics_validation.py

